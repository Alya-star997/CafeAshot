<!-- Стили для этой формы (чтобы было красиво) -->
<style>
    .booking-section {
        max-width: 500px;
        margin: 40px auto;
        background: #ffffff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
    }
    .booking-section h2 { margin-top: 0; color: #333; }
    .booking-section p { color: #666; font-size: 14px; margin-bottom: 20px; }
    .booking-form label { display: block; text-align: left; margin-bottom: 8px; font-weight: bold; color: #333;}
    .booking-form input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0d5c8;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 20px;
        box-sizing: border-box;
        cursor: pointer;
    }
    .booking-form input:focus { outline: none; border-color: #6b3f1d; }
    .booking-btn {
       align-items: center;
        width: 100%;
        padding: 14px;
        background:transparent;
        color: rgb(7, 6, 6);
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        transition: background 0.3s;
        margin: 0 ;
    }
    .booking-btn:hover { background: #8a5228; }
</style>
